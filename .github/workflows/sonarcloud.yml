
name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    name: Analyze C code
    runs-on: ubuntu-latest

    env:
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v8.3.0

      - name: Compile C files with Build Wrapper
        run: |
          mkdir -p /tmp/sonar-objects

          build-wrapper-linux-x86-64 \
            --out-dir "$BUILD_WRAPPER_OUT_DIR" \
            bash -c '
              for file in main*.c; do
                echo "Compilando $file"
                gcc -c "$file" -o "/tmp/sonar-objects/${file%.c}.o" || exit 1
              done
            '

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            --define
            sonar.cfamily.compile-commands=build_wrapper_output_directory/compile_commands.json
